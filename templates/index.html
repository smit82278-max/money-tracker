<!DOCTYPE html>
<html>

<head>
    <title>Money Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center mb-4">💰 Family Money Tracker</h2>

        <!-- Form -->
        <form method="POST" action="/add" class="card p-4 mb-4">

            <select name="name" class="form-control mb-2" required>
                <option value="">Select Name</option>
                <option>Neel</option>
                <option>smit</option>
                <option>sureshbhai</option>
                <option>Other</option>
            </select>

            <input type="text" name="title" class="form-control mb-2" placeholder="Expense Title" required>

            <input type="number" step="0.01" name="amount" class="form-control mb-2" placeholder="Amount" required>

            <input type="text" name="location" class="form-control mb-2" placeholder="Location" required>

            <button class="btn btn-primary">Add Expense</button>
        </form>

        <!-- Total -->
        <div class="alert alert-success text-center">
            <h4>Total Spent: ₹ {{ total }}</h4>
        </div>

        <!-- Table -->
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Location</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for exp in expenses %}
                <tr>
                    <td>{{ exp[1] }}</td>
                    <td>{{ exp[2] }}</td>
                    <td>₹ {{ exp[3] }}</td>
                    <td>{{ exp[4] }}</td>
                    <td>{{ exp[5] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</body>

</html>
